name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Wish Sync Variables
        env:
          VITE_TCB_ENV_ID: ${{ vars.VITE_TCB_ENV_ID }}
          VITE_JIEYOU_WISH_SYNC_PUBLIC_ENDPOINT: ${{ vars.VITE_JIEYOU_WISH_SYNC_PUBLIC_ENDPOINT }}
          VITE_JIEYOU_WISH_SYNC_TOKEN: ${{ vars.VITE_JIEYOU_WISH_SYNC_TOKEN }}
        run: node tools/check-wish-sync-public-env.mjs

      - name: Build
        env:
          VITE_TCB_ENV_ID: ${{ vars.VITE_TCB_ENV_ID }}
          VITE_JIEYOU_WISH_SYNC_ENDPOINT: ${{ vars.VITE_JIEYOU_WISH_SYNC_ENDPOINT }}
          VITE_JIEYOU_WISH_SYNC_PUBLIC_ENDPOINT: ${{ vars.VITE_JIEYOU_WISH_SYNC_PUBLIC_ENDPOINT }}
          VITE_JIEYOU_WISH_SYNC_TOKEN: ${{ vars.VITE_JIEYOU_WISH_SYNC_TOKEN }}
        run: pnpm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
